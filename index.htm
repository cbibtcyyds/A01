<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 在线对话助手 (支持自定义配置)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f7f8;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }
        .config-toggle {
            background: none;
            border: 1px solid #d9d9d9;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            color: #555;
            background-color: #fafafa;
        }
        .config-toggle:hover {
            background-color: #f0f0f0;
        }
        /* 配置面板折叠区 */
        .config-panel {
            background-color: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            padding: 15px 20px;
            display: none;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .config-panel.show {
            display: flex;
        }
        .config-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 220px;
        }
        .config-item label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #666;
        }
        .config-item input {
            padding: 8px 10px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }
        .config-item input:focus {
            border-color: #10a37f;
        }
        .config-actions {
            display: flex;
            gap: 8px;
        }
        .btn {
            background-color: #10a37f;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            font-weight: 600;
            cursor: pointer;
            height: 35px;
            font-size: 0.9rem;
        }
        .btn:hover {
            background-color: #0d8c6d;
        }
        .btn-secondary {
            background-color: #f0f0f0;
            color: #333;
            border: 1px solid #d9d9d9;
        }
        .btn-secondary:hover {
            background-color: #e0e0e0;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            display: flex;
            max-width: 80%;
            line-height: 1.5;
            word-break: break-word;
        }
        .message.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }
        .message.assistant {
            margin-right: auto;
        }
        .bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }
        .user .bubble {
            background-color: #10a37f;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .assistant .bubble {
            background-color: #ffffff;
            color: #333;
            border: 1px solid #e5e5e5;
            border-bottom-left-radius: 2px;
        }
        .input-container {
            background-color: #ffffff;
            border-top: 1px solid #e5e5e5;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .input-box {
            max-width: 800px;
            width: 100%;
            display: flex;
            gap: 10px;
        }
        textarea {
            flex: 1;
            padding: 12px;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            resize: none;
            height: 50px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-color: #10a37f;
        }
        .send-btn {
            background-color: #10a37f;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .send-btn:hover {
            background-color: #0d8c6d;
        }
        .send-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>
        <h1>AI 智能对话</h1>
        <button class="config-toggle" onclick="toggleConfig()">⚙️ 设置 API 参数</button>
    </header>

    <!-- 可视化配置面板 -->
    <div class="config-panel" id="configPanel">
        <div class="config-item">
            <label for="apiUrlInput">API 接口地址 (URL)</label>
            <input type="text" id="apiUrlInput" placeholder="例如: https://api.openai.com/v1/chat/completions">
        </div>
        <div class="config-item">
            <label for="apiKeyInput">API Token (Key)</label>
            <input type="password" id="apiKeyInput" placeholder="请输入你的 sk-...">
        </div>
        <div class="config-item">
            <label for="modelInput">模型名称 (Model)</label>
            <input type="text" id="modelInput" placeholder="例如: gpt-3.5-turbo">
        </div>
        <div class="config-actions">
            <button class="btn btn-secondary" onclick="loadSampleConfig()">填入示例</button>
            <button class="btn" onclick="saveConfig()">保存设置</button>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message assistant">
            <div class="bubble">你好！点击右上角“设置 API 参数”可以配置你的 Token，或者点击“填入示例”快速加载预设配置。</div>
        </div>
    </div>

    <div class="input-container">
        <div class="input-box">
            <textarea id="userInput" placeholder="输入你想问的问题，按回车发送..." rows="1"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        // 定义预设的 API 示例（你可以随时在这里修改你的默认测试数据）
        const SAMPLE_API_URL = "https://api.openai.com/v1/chat/completions";
        const SAMPLE_API_KEY = "sk-8nncybljgybz4wbo6an5bhm2j8s00000test";
        const SAMPLE_MODEL = "gpt-3.5-turbo";

        const apiUrlInput = document.getElementById("apiUrlInput");
        const apiKeyInput = document.getElementById("apiKeyInput");
        const modelInput = document.getElementById("modelInput");
        const configPanel = document.getElementById("configPanel");

        // 初始化加载本地缓存，若没有则保持为空（或可按需设置为默认展示示例）
        apiUrlInput.value = localStorage.getItem("ai_api_url") || "";
        apiKeyInput.value = localStorage.getItem("ai_api_key") || "";
        modelInput.value = localStorage.getItem("ai_model") || "";

        function toggleConfig() {
            configPanel.classList.toggle("show");
        }

        // 一键填入示例配置
        function loadSampleConfig() {
            apiUrlInput.value = SAMPLE_API_URL;
            apiKeyInput.value = SAMPLE_API_KEY;
            modelInput.value = SAMPLE_MODEL;
            alert("已成功加载示例配置！");
        }

        function saveConfig() {
            localStorage.setItem("ai_api_url", apiUrlInput.value.trim());
            localStorage.setItem("ai_api_key", apiKeyInput.value.trim());
            localStorage.setItem("ai_model", modelInput.value.trim());
            alert("配置已保存！");
            configPanel.classList.remove("show");
        }

        const chatContainer = document.getElementById("chatContainer");
        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");

        let messageHistory = [
            { role: "system", content: "You are a helpful assistant." }
        ];

        userInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const currentApiUrl = apiUrlInput.value.trim() || SAMPLE_API_URL;
            const currentApiKey = apiKeyInput.value.trim() || SAMPLE_API_KEY;
            const currentModel = modelInput.value.trim() || SAMPLE_MODEL;

            if (!currentApiKey) {
                alert("请先点击右上角“设置 API 参数”填入 API Token，或点击“填入示例”！");
                configPanel.classList.add("show");
                return;
            }

            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, "user");
            userInput.value = "";
            userInput.style.height = "50px";

            messageHistory.push({ role: "user", content: text });
            setLoading(true);

            const assistantBubble = appendMessage("", "assistant");

            try {
                const response = await fetch(currentApiUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${currentApiKey}`
                    },
                    body: JSON.stringify({
                        model: currentModel,
                        messages: messageHistory,
                        stream: true
                    })
                });

                if (!response.ok) {
                    const errData = await response.text();
                    throw new Error(`请求失败 (${response.status}): ${errData}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let fullResponse = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split("\n");

                    for (const line of lines) {
                        const trimmedLine = line.trim();
                        if (trimmedLine.startsWith("data: ")) {
                            const dataStr = trimmedLine.substring(6);
                            if (dataStr === "[DONE]") break;

                            try {
                                const parsed = JSON.parse(dataStr);
                                const content = parsed.choices[0]?.delta?.content || "";
                                if (content) {
                                    fullResponse += content;
                                    assistantBubble.textContent = fullResponse;
                                    chatContainer.scrollTop = chatContainer.scrollHeight;
                                }
                            } catch (e) {
                                // 忽略解析错误
                            }
                        }
                    }
                }

                messageHistory.push({ role: "assistant", content: fullResponse });

            } catch (error) {
                assistantBubble.textContent = "发生错误: " + error.message;
                assistantBubble.style.color = "red";
            } finally {
                setLoading(false);
            }
        }

        function appendMessage(text, role) {
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${role}`;

            const bubbleDiv = document.createElement("div");
            bubbleDiv.className = "bubble";
            bubbleDiv.textContent = text;

            messageDiv.appendChild(bubbleDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            return bubbleDiv;
        }

        function setLoading(isLoading) {
            sendBtn.disabled = isLoading;
            userInput.disabled = isLoading;
        }
    </script>
</body>
</html>
